<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Landline Properties</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<main class="login-wrap">
  <section class="login-card" aria-labelledby="login-title">
    <h1 class="brand" id="login-title">LAND<span>LINE</span></h1>
    <div class="sub">Admin Dashboard Login</div>

    <div class="error-box" id="error-box" role="alert" aria-live="assertive" tabindex="-1" hidden></div>

    <form id="login-form">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" required maxlength="190" autocomplete="username" inputmode="email" spellcheck="false" placeholder="admin@landline.com">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Log In</button>
    </form>
  </section>
</main>

<script src="js/admin-core.js"></script>
<script>
  if (!window.__LANDLINE_FILE_ORIGIN__) {
  // Already logged in? Verify the secure server-side cookie first.
  apiRequest('/auth/me').then(() => { window.location.href = 'dashboard.html'; }).catch(() => {});

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('error-box');
    const btn = document.getElementById('submit-btn');
    errorBox.hidden = true;
    errorBox.textContent = '';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Logging in...';
    btn.setAttribute('aria-busy', 'true');

    try {
      const res = await apiRequest('/auth/login', { method: 'POST', body: { email, password } });
      Auth.setUser(res.user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message || 'Login failed.';
      errorBox.hidden = false;
      errorBox.focus();
      btn.disabled = false;
      btn.textContent = 'Log In';
      btn.removeAttribute('aria-busy');
    }
  });
  }
</script>
</body>
</html>
